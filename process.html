<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Процессы взаимодействия — 37 ситуаций</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --border:#dbe0e6; --text:#1f2937; --muted:#6b7280;
  --accent:#2563eb; --accent-dark:#1d4ed8; --accent-soft:#eaf0fd;
  --ok-bg:#d9f2df; --ok-bd:#8fd6a4; --ok-tx:#166534;
  --part-bg:#fdf3d0; --part-bd:#e6c766; --part-tx:#854d0e;
  --no-bg:#fde8e6; --no-bd:#f0a8a0; --no-tx:#991b1b;
  --sub-bg:#e6ecfb; --sub-bd:#9db2e8; --sub-tx:#1e3a8a;
  --agent:#7c3aed; --agent-soft:#f3ecfe; --agent-bd:#c4a7f7;
  --human:#0f766e; --human-soft:#e6f6f4; --human-bd:#8fd6cf;
  --warn-bg:#fff7ed; --warn-bd:#fed7aa; --warn-tx:#9a3412;
  --radius:8px;
  --shadow:0 4px 14px rgba(15,23,42,.08);
  --mono:Consolas,"Cascadia Mono",monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-size:13px; line-height:1.45;
  font-family:"Segoe UI",Roboto,Arial,sans-serif; padding-bottom:40px;
}
a{color:var(--accent); text-decoration:none;}
a:hover{text-decoration:underline;}
code,.mono{font-family:var(--mono); font-size:12px;}
h1{font-size:16px; margin:0 0 2px;}
h2{font-size:14px; margin:18px 0 8px;}
h3{font-size:13px; margin:14px 0 6px;}
h4{margin:0 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);}

/* Шапка */
header.app{
  position:sticky; top:0; z-index:40; background:var(--panel);
  border-bottom:1px solid var(--border); padding:10px 16px;
}
header.app .sub{color:var(--muted); font-size:12px; margin-bottom:8px; line-height:1.45;}
.toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
.toolbar .grow{flex:1 1 auto;}
.badge{
  display:inline-block; background:#eef1f6; border-radius:4px; padding:2px 6px;
  font-size:11px; color:var(--muted); white-space:nowrap;
}
.badge.human{background:var(--human-soft); color:var(--human);}
.badge.warn{background:var(--warn-bg); color:var(--warn-tx); border:1px solid var(--warn-bd);}

/* Кнопки, сегменты */
button,.btn{
  cursor:pointer; border:1px solid var(--border); background:var(--panel);
  border-radius:6px; padding:6px 10px; font-size:12px; color:var(--text);
  font-family:inherit; display:inline-block;
}
button:hover,.btn:hover{background:#eef1f5; text-decoration:none;}
button.primary{background:var(--accent); border-color:var(--accent-dark); color:#fff;}
button.primary:hover{background:var(--accent-dark);}
.seg{display:flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; background:var(--panel); flex-wrap:wrap;}
.seg button{border:none; border-radius:0; border-right:1px solid var(--border); font-size:11.5px;}
.seg button:last-child{border-right:none;}
.seg button.active{background:var(--accent); color:#fff;}
select,input[type=text],input[type=search]{
  padding:6px 8px; border:1px solid var(--border); border-radius:6px;
  font-size:12px; background:#fff; font-family:inherit; color:var(--text);
}
label.inline{display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:11px;}

/* Статистика */
.stats{display:flex; flex-wrap:wrap; gap:8px; padding:12px 16px 4px;}
.stat{
  background:var(--panel); border:1px solid var(--border); border-radius:8px;
  padding:7px 12px; min-width:104px;
}
.stat b{display:block; font-size:17px; line-height:1.1;}
.stat span{color:var(--muted); font-size:11px;}

.hint{color:var(--muted); font-size:11px; line-height:1.5; margin:4px 16px 10px;}

/* Сетка сценариев */
.scenario-list{padding:0 16px 40px; display:flex; flex-direction:column; gap:22px;}
.section-group{margin:0;}
.section-head{
  display:flex; align-items:center; gap:8px; margin:8px 0 10px;
  font-size:12.5px; font-weight:700; color:#334155; text-transform:uppercase;
  letter-spacing:.03em;
}
.section-head .badge{font-weight:500; text-transform:none; letter-spacing:0;}
.cards{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:8px;
}
.scenario-card{
  background:var(--panel); border:1px solid var(--border); border-radius:10px;
  padding:10px 12px; cursor:pointer; text-align:left; font:inherit; color:inherit;
  transition:transform .1s, box-shadow .1s, border-color .1s;
  display:flex; flex-direction:column; gap:5px;
}
.scenario-card:hover{transform:translateY(-1px); box-shadow:var(--shadow); border-color:var(--accent);}
.scenario-card .sid{font-family:var(--mono); font-size:10.5px; color:var(--muted); font-weight:700;}
.scenario-card .stitle{font-size:13px; font-weight:600; line-height:1.3;}
.scenario-card .ssum{font-size:11.5px; color:var(--muted); line-height:1.4;}
.scenario-card .smeta{display:flex; gap:4px; flex-wrap:wrap; margin-top:2px;}
.pill{font-size:10px; border-radius:4px; padding:1px 6px; border:1px solid transparent; white-space:nowrap; font-weight:500;}
.pill.urgent{background:var(--no-bg); border-color:var(--no-bd); color:var(--no-tx);}
.pill.normal{background:var(--part-bg); border-color:var(--part-bd); color:var(--part-tx);}
.pill.routine{background:var(--sub-bg); border-color:var(--sub-bd); color:var(--sub-tx);}
.pill.none{background:#eef1f4; color:var(--muted);}

/* Модальное окно плеера */
.modal-overlay{
  position:fixed; inset:0; background:rgba(15,23,42,.5); z-index:80;
  display:flex; align-items:flex-start; justify-content:center; padding:32px 16px;
  overflow-y:auto;
}
.modal-overlay[hidden]{display:none;}
.modal{
  background:var(--panel); border-radius:12px; max-width:900px; width:100%;
  box-shadow:0 20px 50px rgba(15,23,42,.35); padding:18px 20px;
  position:relative;
}
.modal-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:6px;}
.modal-head h2{margin:0; font-size:16px; line-height:1.3;}
.modal-close{
  border:none; background:#eef1f6; border-radius:6px; padding:5px 10px;
  font-size:13px; cursor:pointer; color:var(--text); flex-shrink:0;
}
.modal-close:hover{background:#dde2e9;}

.player-meta{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:10px;}
.player-meta .badge{font-family:var(--mono);}

.player-summary{
  background:var(--accent-soft); border-left:3px solid var(--accent);
  padding:8px 12px; border-radius:0 6px 6px 0; font-size:12.5px;
  margin-bottom:12px; line-height:1.5;
}

.progress{height:6px; background:#e5e7eb; border-radius:99px; overflow:hidden; margin:14px 0 8px;}
.progress > i{display:block; height:100%; background:var(--accent); width:0%; transition:width .3s ease;}

.steps{display:flex; flex-direction:column; gap:8px; margin:8px 0 14px;}
.step{
  display:grid; grid-template-columns:minmax(90px, 130px) minmax(0, 1fr);
  gap:10px; align-items:flex-start;
  border:1px solid var(--border); border-radius:8px; padding:9px 12px;
  background:#fbfcfd; transition:opacity .2s, background .2s, border-color .2s;
}
.step.dim{opacity:.35;}
.step.active{background:var(--accent-soft); border-color:var(--accent); box-shadow:0 0 0 2px rgba(37,99,235,.14);}
.step-num{
  position:absolute; display:none;
}
.step-lane{
  display:inline-flex; align-items:center; gap:5px; font-size:11.5px;
  font-weight:700; padding:2px 8px; border-radius:4px; white-space:nowrap;
  border:1px solid transparent;
}
.step-lane.human   { background:var(--human-soft); border-color:var(--human-bd); color:var(--human); }
.step-lane.agent   { background:var(--agent-soft); border-color:var(--agent-bd); color:var(--agent); }
.step-lane.contractor { background:var(--part-bg); border-color:var(--part-bd); color:var(--part-tx); }
.step-lane.system  { background:#eef1f6; border-color:#cfd5dd; color:#334155; }
.step-lane.observer{ background:#f3f4f6; border-color:#d1d5db; color:#374151; }
.step-text{font-size:12.5px; line-height:1.5;}

.nav-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:6px;}
.nav-row .counter{margin-left:auto; font-size:11.5px; color:var(--muted); font-family:var(--mono);}

details.extra{margin-top:14px; border-top:1px dashed var(--border); padding-top:12px;}
details.extra > summary{cursor:pointer; font-size:12px; font-weight:600; color:var(--muted);}
details.extra[open] > summary{margin-bottom:8px;}
details.extra ul{margin:0; padding-left:20px;}
details.extra li{margin-bottom:4px; line-height:1.5; font-size:12px;}

/* Мобильный */
@media (max-width: 720px){
  header.app{padding:9px 12px 10px;}
  header.app h1{font-size:14px;}
  .toolbar{gap:6px;}
  .seg button{font-size:11px; padding:5px 7px;}
  .stats{padding:8px 12px 4px; flex-wrap:nowrap; overflow-x:auto;}
  .stat{min-width:96px;}
  .scenario-list{padding:0 12px 30px;}
  .cards{grid-template-columns:1fr;}
  .modal-overlay{padding:10px;}
  .modal{padding:14px;}
  .modal-head h2{font-size:14px;}
  .step{grid-template-columns:1fr; gap:5px;}
  select,input[type=text],input[type=search]{font-size:16px;}
}
@media (max-width: 480px){
  .nav-row{flex-direction:column;}
  .nav-row button{width:100%;}
  .nav-row .counter{margin-left:0; align-self:center;}
}
</style>
</head>
<body>

<header class="app">
  <h1>Процессы взаимодействия</h1>
  <div class="sub">
    37 ситуаций из цикла «житель → депутат-диспетчер → подрядчик».
    Кликните карточку — откроется плеер с шагами, ролями и SLA.
    Стрелки ← → листают шаги, Esc закрывает.
  </div>
  <div class="toolbar">
    <div class="seg" id="sectionSeg">
      <button data-section="all" class="active">Все 37</button>
      <button data-section="before">8.1 До принятия (8)</button>
      <button data-section="during">8.2 В работе (20)</button>
      <button data-section="contractors">8.3 Подрядчики (5)</button>
      <button data-section="feedback">8.4 Отчётность (4)</button>
    </div>
    <label class="inline">Поиск <input type="search" id="searchInput" placeholder="С9, авария, подрядчик…" style="width:200px"></label>
    <div class="grow"></div>
    <a class="btn" href="index.html">← Матрица прав</a>
  </div>
</header>

<div class="stats" id="statsRow"></div>
<div class="hint" id="listHint"></div>

<div class="scenario-list" id="scenarioList"></div>

<div class="modal-overlay" id="modal" hidden>
  <div class="modal" id="modalContent"></div>
</div>

<script>

  /* ── Секции ──────────────────────────────────────────────────────────── */
  var SECTIONS = {

  /* ── 37 ситуаций ─────────────────────────────────────────────────────── */
  var SCENARIOS = [
    /* 8.1 ДО ПРИНЯТИЯ */
    { id:'С1', section:'before', title:'Житель подал неполно',

      steps:[
        { lane:'deputy', text:'Уточняет по контакту в течение 1 рабочего дня.' },

    { id:'С21', section:'during', title:'Житель недоволен ответом',

      steps:[
        { lane:'deputy', text:'Первая жалоба — пересмотр депутатом лично.' },

        { lane:'deputy', text:'Третья — приглашение на личный приём, фиксация в протоколе.' },
        { lane:'deputy', text:'Системная неудовлетворённость — обращение в комиссию по работе с обращениями.' }

    { id:'С22', section:'during', title:'Массовое обращение',
      summary:'Одна проблема — 50 заявок.',
      priority:'normal',
      steps:[

        { lane:'deputy', text:'Все жители получают ответ по одной ветке.' },
        { lane:'deputy', text:'Ведёт отдельную коммуникацию с администрацией.' },
        { lane:'system', text:'В отчёте — одна проблема, не 50 заявок.' }

    },
    { id:'С23', section:'during', title:'Повторное обращение',
      summary:'Житель пишет снова.',
      priority:'normal',
      steps:[
        { lane:'deputy', text:'Проверяет: проблема вернулась или не была решена?' },
        { lane:'deputy', text:'Вернулась — новое с пометкой «рецидив».' },
        { lane:'deputy', text:'Не решена — эскалация + жалоба на подрядчика.' }
      ]
    },
    { id:'С24', section:'during', title:'Вандализм, порча имущества',
      summary:'Кто-то сломал лавочку, разбил окно.',

      steps:[
        { lane:'deputy', text:'Полиция (заявление), страховая (если застраховано), подрядчик — на восстановление.' },
        { lane:'deputy', text:'Координирует, но не расследует.' }
      ]
    },
    { id:'С25', section:'during', title:'Жалоба на другого подрядчика или службу',
      summary:'Не в зоне ответственности депутата.',
      priority:'none',
      steps:[
        { lane:'deputy', text:'Переадресация с контактом.' },
        { lane:'deputy', text:'Системно — ходатайство в администрацию.' }
      ]
    },
    { id:'С26', section:'during', title:'Житель другого округа',
      summary:'Обратился не к своему депутату.',
      priority:'none',
      steps:[
        { lane:'deputy', text:'Передаёт депутату того округа (по телефону или через коллег) с согласия жителя.' },
        { lane:'deputy', text:'Или переадресация с контактом.' }
      ]
    },
    { id:'С27', section:'during', title:'Обращение в нерабочее время',
      summary:'Вечер, выходной.',
      priority:'normal',
      steps:[
        { lane:'system', text:'Приёмная фиксирует в первый рабочий день.' },
        { lane:'deputy', text:'Исключение — аварии: депутат (или дежурный) принимает немедленно.' },
        { lane:'system', text:'Регистрация с пометкой «после факта».' }
      ]
    },
    { id:'С28', section:'during', title:'Двойное обращение в разные каналы',
      summary:'Звонок + email + соцсети по одному поводу.',
      priority:'normal',
      steps:[
        { lane:'system', text:'Дедупликация по телефону + тексту + адресу.' },
        { lane:'deputy', text:'Объединение, житель получает один номер.' }
      ]
    },

    /* 8.3 ПОДРЯДЧИКИ */
    { id:'С29', section:'contractors', title:'Подрядчик не в системе',
      summary:'Нет API, только телефон.',
      priority:'normal',
      steps:[
        { lane:'deputy', text:'Ведёт заявку у себя, подрядчику отправляет email или звонит.' },
        { lane:'contractor', text:'Отвечает по телефону или email.' },
        { lane:'deputy', text:'Ответ фиксирует в системе вручную.' },
        { lane:'system', text:'Допустимо, но требует дисциплины.' }
      ]
    },
    { id:'С30', section:'contractors', title:'Аварийная служба 24/7',
      summary:'Всегда телефон + дежурный.',
      priority:'urgent',
      steps:[
        { lane:'deputy', text:'Звонит лично в диспетчерскую, не отправляет заявку.' },
        { lane:'deputy', text:'Параллельно регистрирует в системе.' }
      ]
    },
    { id:'С31', section:'contractors', title:'Подрядчик — сам депутат',
      summary:'Конфликт интересов: ИП депутата или его бюджет.',
      priority:'none',
      steps:[
        { lane:'deputy', text:'Заявка проверяется помощником или комиссией.' },
        { lane:'assistant', text:'Принимает результат вместо депутата.' },
        { lane:'deputy', text:'Депутат не закрывает заявку сам.' }
      ]
    },
    { id:'С32', section:'contractors', title:'Сезонные работы',
      summary:'Уборка снега, ямочный ремонт, озеленение.',
      sla:'В течение сезона', priority:'routine',
      steps:[
        { lane:'deputy', text:'Плановые заявки на сезон.' },
        { lane:'system', text:'SLA — «в течение сезона».' },
        { lane:'deputy', text:'Отдельная отчётность: сколько запланировано и выполнено.' }
      ]
    },
    { id:'С33', section:'contractors', title:'Ведомственная подчинённость',
      summary:'МЧС, МВД, скорая.',
      priority:'urgent',
      steps:[
        { lane:'deputy', text:'Только 112 и координация с дежурным.' },
        { lane:'deputy', text:'Не диспетчеризует эти службы сам.' },
        { lane:'system', text:'Регистрация в системе с пометкой «внешняя служба».' }
      ]
    },

    /* 8.4 ОТЧЁТНОСТЬ И ОБРАТНАЯ СВЯЗЬ */
    { id:'С34', section:'feedback', title:'Житель хочет знать статус',
      summary:'Спрашивает, что происходит с обращением.',
      priority:'none',
      steps:[
        { lane:'system', text:'Показывает в личном кабинете, по SMS или через звонок в приёмную.' },
        { lane:'system', text:'Статусы жителю: «Принято», «Назначено», «В работе», «Выполнено, проверьте», «Закрыто», «Отклонено», «Переадресовано».' }
      ]
    },
    { id:'С35', section:'feedback', title:'Житель хочет пожаловаться на депутата',
      summary:'Отдельный контур.',
      priority:'none',
      steps:[
        { lane:'deputy', text:'Жалоба регистрируется отдельно, передаётся руководству.' },
        { lane:'deputy', text:'Депутат не рассматривает жалобу на себя.' }
      ]
    },
    { id:'С36', section:'feedback', title:'Ежемесячный отчёт депутата',
      summary:'Автоматический свод.',
      priority:'none',
      steps:[
        { lane:'system', text:'Считает: сколько обращений, категории, среднее время ответа, % в срок, топ подрядчиков по просрочкам, карта обращений.' },
        { lane:'deputy', text:'Публикует на сайте и в соцсетях.' }
      ]
    },
    { id:'С37', section:'feedback', title:'Запрос от прокуратуры или администрации',
      summary:'Выгрузка с аудитом.',
      priority:'none',
      steps:[
        { lane:'system', text:'Выгрузка по запросу с полным журналом действий.' },
        { lane:'observer', text:'Только для наблюдателей. Остальные роли не видят.' }
      ]
    }
  ];

  /* ── Рендер: статистика ─────────────────────────────────────────────── */
  function renderStats(){
    var total = SCENARIOS.length;
    var bySec = { before:0, during:0, contractors:0, feedback:0 };
    var urgent = 0;
    SCENARIOS.forEach(function(s){
      bySec[s.section] = (bySec[s.section] || 0) + 1;
      if (s.priority === 'urgent') urgent++;
    });
    document.getElementById('statsRow').innerHTML =
      '<div class="stat"><b>'+total+'</b><span>всего ситуаций</span></div>'+
      '<div class="stat"><b>'+bySec.before+'</b><span>до принятия</span></div>'+
      '<div class="stat"><b>'+bySec.during+'</b><span>в работе</span></div>'+
      '<div class="stat"><b>'+bySec.contractors+'</b><span>подрядчики</span></div>'+
      '<div class="stat"><b>'+bySec.feedback+'</b><span>отчётность</span></div>'+
      '<div class="stat"><b style="color:var(--no-tx)">'+urgent+'</b><span>аварийных</span></div>';
  }

  /* ── Рендер: список карточек ────────────────────────────────────────── */
  var state = { section:'all', search:'' };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function visibleScenarios(){
    return SCENARIOS.filter(function(s){
      if (state.section !== 'all' && s.section !== state.section) return false;
      if (state.search) {
        var q = state.search.toLowerCase();
        var hay = (s.id+' '+s.title+' '+s.summary+' '+s.steps.map(function(st){return st.text;}).join(' ')).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function renderList(){
    var list = visibleScenarios();
    var wrap = document.getElementById('scenarioList');
    var hint = document.getElementById('listHint');

    if (!list.length) {
      wrap.innerHTML = '<div class="hint" style="text-align:center;padding:24px">Ситуаций по фильтру не найдено</div>';
      hint.textContent = '';
      return;
    }
    hint.textContent = 'Показано: ' + list.length + ' из ' + SCENARIOS.length;

    // группируем по секциям
    var groups = {};
    list.forEach(function(s){
      if (!groups[s.section]) groups[s.section] = [];
      groups[s.section].push(s);
    });

    var order = ['before','during','contractors','feedback'];
    var html = '';
    order.forEach(function(sec){
      if (!groups[sec]) return;
      var meta = SECTIONS[sec];
      html += '<div class="section-group">' +
        '<div class="section-head">' +
          '<span>'+meta.icon+'</span>' +
          '<span>'+esc(meta.title)+'</span>' +
          '<span class="badge">'+groups[sec].length+' ситуаций</span>' +
        '</div>' +
        '<div class="cards">';
      groups[sec].forEach(function(s){
        var p = PRIORITY[s.priority] || PRIORITY.none;
        html += '<button class="scenario-card" data-id="'+esc(s.id)+'">' +
          '<span class="sid">'+esc(s.id)+'</span>' +
          '<span class="stitle">'+esc(s.title)+'</span>' +
          '<span class="ssum">'+esc(s.summary)+'</span>' +
          '<span class="smeta">' +
            '<span class="pill '+p.cls+'">'+esc(p.title)+'</span>' +
            (s.sla ? '<span class="badge">⏱ '+esc(s.sla)+'</span>' : '') +
            '<span class="badge">'+s.steps.length+' шаг'+(s.steps.length>1?'а':'')+'</span>' +
          '</span>' +
        '</button>';
      });
      html += '</div></div>';
    });
    wrap.innerHTML = html;
  }

  /* ── Плеер ──────────────────────────────────────────────────────────── */
  var player = { scenario:null, step:0 };

  function laneLabel(lane){
    var map = {
      resident:   { cls:'human',      name:'Житель' },
      deputy:     { cls:'human',      name:'Депутат' },
      assistant:  { cls:'human',      name:'Помощник' },
      controller: { cls:'human',      name:'Контролёр' },
      admin:      { cls:'human',      name:'Администратор' },
      contractor: { cls:'contractor', name:'Подрядчик' },
      system:     { cls:'system',     name:'Система' },
      observer:   { cls:'observer',   name:'Наблюдатель' }
    };
    return map[lane] || { cls:'system', name:lane };
  }

  function renderPlayer(){
    var s = player.scenario;
    if (!s) return;
    var p = PRIORITY[s.priority] || PRIORITY.none;

    var stepsHtml = s.steps.map(function(st, i){
      var l = laneLabel(st.lane);
      var active = (i === player.step);
      return '<div class="step'+(active?' active':'')+(player.step>=0 && i>player.step?' dim':'')+'">' +
        '<span class="step-lane '+l.cls+'">'+esc(l.name)+'</span>' +
        '<div class="step-text">'+esc(st.text)+'</div>' +
      '</div>';
    }).join('');

    var progress = s.steps.length > 1 ? Math.round((player.step+1) / s.steps.length * 100) : 100;

    document.getElementById('modalContent').innerHTML =
      '<div class="modal-head">' +
        '<div>' +
          '<h2>'+esc(s.id)+' · '+esc(s.title)+'</h2>' +
          '<div class="player-meta">' +
            '<span class="badge">'+esc(SECTIONS[s.section].title)+'</span>' +
            '<span class="pill '+p.cls+'">'+esc(p.title)+'</span>' +
            (s.sla ? '<span class="badge">⏱ '+esc(s.sla)+'</span>' : '') +
          '</div>' +
        '</div>' +
        '<button class="modal-close" id="btnClose">✕ Esc</button>' +
      '</div>' +
      '<div class="player-summary">'+esc(s.summary)+'</div>' +
      '<div class="steps">'+stepsHtml+'</div>' +
      '<div class="progress"><i style="width:'+progress+'%"></i></div>' +
      '<div class="nav-row">' +
        '<button id="btnPrev" class="primary" '+(player.step===0?'disabled':'')+'>← Назад</button>' +
        '<button id="btnNext" class="primary" '+(player.step>=s.steps.length-1?'disabled':'')+'>Вперёд →</button>' +
        '<span class="counter">Шаг '+(player.step+1)+' из '+s.steps.length+'</span>' +
      '</div>';

    document.getElementById('btnClose').addEventListener('click', closePlayer);
    document.getElementById('btnPrev').addEventListener('click', function(){
      if (player.step > 0) { player.step--; renderPlayer(); }
    });
    document.getElementById('btnNext').addEventListener('click', function(){
      if (player.step < s.steps.length - 1) { player.step++; renderPlayer(); }
    });
  }

  function openPlayer(id){
    var s = SCENARIOS.find(function(x){return x.id === id;});
    if (!s) return;
    player.scenario = s;
    player.step = 0;
    document.getElementById('modal').hidden = false;
    document.body.style.overflow = 'hidden';
    renderPlayer();
  }

  function closePlayer(){
    document.getElementById('modal').hidden = true;
    document.body.style.overflow = '';
    player.scenario = null;
  }

  /* ── События ────────────────────────────────────────────────────────── */
  document.getElementById('sectionSeg').addEventListener('click', function(e){
    var b = e.target.closest('button[data-section]'); if (!b) return;
    state.section = b.dataset.section;
    document.querySelectorAll('#sectionSeg button').forEach(function(x){ x.classList.toggle('active', x===b); });
    renderList();
  });
  document.getElementById('searchInput').addEventListener('input', function(e){
    state.search = e.target.value.trim();
    renderList();
  });
  document.getElementById('scenarioList').addEventListener('click', function(e){
    var c = e.target.closest('.scenario-card'); if (!c) return;
    openPlayer(c.dataset.id);
  });
  document.getElementById('modal').addEventListener('click', function(e){
    if (e.target.id === 'modal') closePlayer();
  });
  document.addEventListener('keydown', function(e){
    if (document.getElementById('modal').hidden) return;
    if (e.key === 'Escape') closePlayer();
    else if (e.key === 'ArrowLeft') {
      if (player.step > 0) { player.step--; renderPlayer(); }
    } else if (e.key === 'ArrowRight') {
      if (player.scenario && player.step < player.scenario.steps.length - 1) { player.step++; renderPlayer(); }
    }
  });

  /* ── Старт ──────────────────────────────────────────────────────────── */
  renderStats();
  renderList();
}());
</script>

</body>
</html>
